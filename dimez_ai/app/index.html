<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NFL Parlay Assister</title>
<style>body{font:15px system-ui;background:#0b1220;color:#e5e7eb;margin:auto;max-width:1100px;padding:24px}h1,h2{color:#fff}.bar,.card{background:#172033;border:1px solid #29354d;border-radius:12px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.muted{color:#94a3b8}.edge{color:#4ade80}button{background:#2563eb;color:white;border:0;border-radius:8px;padding:10px 16px;cursor:pointer}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid #334155}.warn{background:#422006;padding:12px;border-radius:8px}</style></head>
<body><h1>NFL Parlay Assister</h1><div class="bar"><span id="status">Loading…</span> <button onclick="refresh()">Refresh fixture data</button></div>
<h2>Top Parlays</h2><div id="parlays" class="grid"></div><h2>Best Edges</h2><div class="card"><table><thead><tr><th>Game</th><th>Market</th><th>Selection</th><th>Book</th><th>Odds</th><th>Edge</th></tr></thead><tbody id="edges"></tbody></table></div>
<h2>This Week's Games</h2><div id="games" class="grid"></div><h2>Line Shopping</h2><div id="shopping" class="grid"></div>
<p class="warn">Probabilities and edges are estimates, never guarantees. Betting involves risk. Only wager where legal and if you meet your jurisdiction's minimum age.</p>
<script>
const pct=x=>(100*x).toFixed(1)+'%'; const odds=x=>x>0?'+'+x:x;
async function load(){let [h,r,m,g]=await Promise.all(['/health','/recommendations','/markets','/games'].map(x=>fetch(x).then(y=>y.json())));status.textContent=(h.data_exists?'Last refresh: '+h.last_successful_refresh.completed_at:'No data')+(h.stale?' — STALE':'');
parlays.innerHTML=r.recommendations.map(p=>`<div class=card><b>${p.type.replace('_',' ').toUpperCase()}</b><p>${p.legs.map(l=>`${l.player_name||l.selection} ${l.side||''} ${l.line??''} @ ${l.sportsbook} (${odds(l.american_odds)})`).join('<br>')}</p><p>Combined ${odds(p.combined_american_odds)} · Win ${pct(p.estimated_probability)} · <span class=edge>EV ${pct(p.expected_value)}</span></p><small class=muted>${p.correlation_note}</small></div>`).join('')||'<p>No qualifying parlays.</p>';
edges.innerHTML=m.markets.map(x=>`<tr><td>${x.away_team} @ ${x.home_team}</td><td>${x.market_key}</td><td>${x.player_name||x.selection} ${x.side||''} ${x.line??''}</td><td>${x.sportsbook}</td><td>${odds(x.american_odds)}</td><td class=edge>${pct(x.edge)}</td></tr>`).join('');games.innerHTML=g.games.map(x=>`<div class=card><b>${x.away_team}</b> at <b>${x.home_team}</b><p class=muted>${x.commence_time}</p></div>`).join('');shopping.innerHTML=m.markets.map(x=>`<div class=card><b>${x.player_name||x.selection} ${x.side||''} ${x.line??''}</b><p>${Object.entries(x.other_prices).map(([book,price])=>`${book}: ${price===null?'N/A':odds(price)}${book===x.sportsbook?' ✓':''}`).join('<br>')}</p></div>`).join('')}
async function refresh(){status.textContent='Refreshing…';let r=await fetch('/refresh',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({fixture:'data/fixtures/odds_api_nfl.json'})});if(!r.ok){status.textContent=(await r.json()).detail;return}await load()}load().catch(e=>status.textContent='API error: '+e);
</script></body></html>
